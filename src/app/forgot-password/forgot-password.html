<div class="login-page">
  <div class="login-card">
    <h1 class="title">Forgot Password</h1>
    <p class="subtitle">Please Enter Your Registered Email</p>

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!submitted">
      <label class="field-label" for="email">Email</label>
      <input id="email" type="email" formControlName="email" autocomplete="email" />

      <button type="submit" class="login-btn" [disabled]="loading">
        {{ loading ? 'Sending…' : 'Send reset link' }}
      </button>
    </form>

    <p class="result" *ngIf="submitted">{{ resultMessage }}</p>

    <a class="forgot-link" routerLink="/login">Back to login</a>
  </div>
</div>
