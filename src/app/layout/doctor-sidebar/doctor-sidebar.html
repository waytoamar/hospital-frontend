@if (open) {
  <div class="backdrop" (click)="close.emit()"></div>
}

<aside class="side" [class.collapsed]="collapsed" [class.open]="open">
  <div class="brand">
    <img src="lungs.jpg" alt="" />
    <div class="brand-text">
      <strong>Chest &amp; Allergy</strong>
      <small>Doctor console</small>
    </div>
  </div>

  <nav class="menu">
    <p class="label">Clinic</p>
    @for (item of items; track item.key) {
      <button [class.active]="active === item.key" [title]="item.label" (click)="navigate.emit(item.key)">
        <span class="icon">{{ item.icon }}</span>
        <span class="text">{{ item.label }}</span>
        @if (item.key === 'board') {
          <b class="count">{{ todayCount }}</b>
        }
      </button>
    }

    <p class="label">Admin</p>
    <button title="Manage staff" (click)="staff.emit()">
      <span class="icon">🧑‍⚕️</span>
      <span class="text">Staff</span>
    </button>
    <button
      title="Download backup of all patient data (do this once a week)"
      [disabled]="backupBusy"
      (click)="backup.emit()"
    >
      <span class="icon">💾</span>
      <span class="text">{{ backupBusy ? 'Downloading…' : 'Backup' }}</span>
    </button>
  </nav>

  <div class="foot">
    <button class="collapse" [title]="collapsed ? 'Open menu' : 'Close menu'" (click)="toggleCollapsed()">
      <span class="icon">{{ collapsed ? '»' : '«' }}</span>
      <span class="text">Collapse</span>
    </button>
    <button class="logout" title="Logout" (click)="logout.emit()">
      <span class="icon">↪</span>
      <span class="text">Logout</span>
    </button>
  </div>
</aside>
