<div class="login-page">
  <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>

  <div class="ring-wrap">
    <div class="ring"></div>

    <div class="login-card">
      <img class="logo" src="lungs.jpg" alt="Chest & Allergy Clinic" />
      <h1 class="title">WELCOME</h1>
      <p class="subtitle">Doctor login · Chest &amp; Allergy Clinic</p>

      <form [formGroup]="form" (ngSubmit)="submit()">
        <input
          id="username"
          type="text"
          formControlName="username"
          autocomplete="username"
          placeholder="Username"
          aria-label="Username"
        />

        <div class="password-wrapper">
          <input
            id="password"
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            autocomplete="current-password"
            placeholder="Password"
            aria-label="Password"
          />
          <button type="button" class="show-btn" (click)="togglePassword()">
            {{ showPassword ? 'HIDE' : 'SHOW' }}
          </button>
        </div>

        <a class="forgot-link" routerLink="/forgot-password">Forgot password?</a>

        <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

        <button type="submit" class="login-btn" [disabled]="loading">
          {{ loading ? 'LOGGING IN…' : 'LOGIN' }}
        </button>

        <a class="back-link" routerLink="/welcome">← Staff portal</a>
      </form>
    </div>
  </div>
</div>
