<div class="login-page">
  <div class="login-card">
    <h1 class="title">Reset Password</h1>
    <p class="subtitle">కొత్త పాస్‌వర్డ్ ఎంటర్ చేయండి</p>

    <form [formGroup]="form" (ngSubmit)="submit()" *ngIf="!successMessage">
      <label class="field-label" for="newPassword">New Password</label>
      <input
        id="newPassword"
        type="password"
        formControlName="newPassword"
        autocomplete="new-password"
      />

      <label class="field-label" for="confirmPassword">Confirm Password</label>
      <input
        id="confirmPassword"
        type="password"
        formControlName="confirmPassword"
        autocomplete="new-password"
      />

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button type="submit" class="login-btn" [disabled]="loading || !token">
        {{ loading ? 'Updating…' : 'Reset password' }}
      </button>
    </form>

    <p class="result" *ngIf="successMessage">{{ successMessage }}</p>

    <a class="forgot-link" routerLink="/login">Back to login</a>
  </div>
</div>
